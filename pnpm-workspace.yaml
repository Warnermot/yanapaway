packages:
  - apps/*

allowBuilds:
  esbuild: true
  sharp: true
  better-sqlite3: true
  '@swc/core': true
  core-js-pure: true
  unrs-resolver: true
  cpu-features: true
  protobufjs: true
  ssh2: true
  '@firebase/util': false
minimumReleaseAgeExclude:
  - astro@7.1.3
  - '@strapi/admin@5.51.0'
  - '@strapi/cloud-cli@5.51.0'
  - '@strapi/content-manager@5.51.0'
  - '@strapi/content-releases@5.51.0'
  - '@strapi/content-type-builder@5.51.0'
  - '@strapi/core@5.51.0'
  - '@strapi/data-transfer@5.51.0'
  - '@strapi/database@5.51.0'
  - '@strapi/email@5.51.0'
  - '@strapi/generators@5.51.0'
  - '@strapi/i18n@5.51.0'
  - '@strapi/logger@5.51.0'
  - '@strapi/openapi@5.51.0'
  - '@strapi/permissions@5.51.0'
  - '@strapi/plugin-cloud@5.51.0'
  - '@strapi/plugin-users-permissions@5.51.0'
  - '@strapi/provider-email-sendmail@5.51.0'
  - '@strapi/provider-upload-local@5.51.0'
  - '@strapi/review-workflows@5.51.0'
  - '@strapi/strapi@5.51.0'
  - '@strapi/types@5.51.0'
  - '@strapi/typescript-utils@5.51.0'
  - '@strapi/upload@5.51.0'
  - '@strapi/utils@5.51.0'
