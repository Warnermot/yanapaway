# Pila de desarrollo por defecto: db + cms + web (targets "dev", hot reload).
#   docker compose up
#
# Pila de producción (targets "prod"), bajo el perfil "prod":
#   docker compose --profile prod up --build web-prod cms-prod
#
# Variables leídas desde un archivo `.env` en la raíz (no versionado).
# Ver `env.example` para la lista completa — copiarlo a `.env` y completar
# los valores antes de levantar cualquier servicio.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DATABASE_USERNAME:-strapi}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:?falta DATABASE_PASSWORD en .env}
      - POSTGRES_DB=${DATABASE_NAME:-yanapaway_cms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi} -d ${DATABASE_NAME:-yanapaway_cms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      target: dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "1337:1337"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/cms/node_modules
      - cms_uploads:/app/apps/cms/public/uploads
    environment:
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-yanapaway_cms}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-strapi}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?falta DATABASE_PASSWORD en .env}
      - DATABASE_SSL=${DATABASE_SSL:-false}
      - APP_KEYS=${APP_KEYS:?falta APP_KEYS en .env}
      - API_TOKEN_SALT=${API_TOKEN_SALT:?falta API_TOKEN_SALT en .env}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:?falta ADMIN_JWT_SECRET en .env}
      - TRANSFER_TOKEN_SALT=${TRANSFER_TOKEN_SALT:?falta TRANSFER_TOKEN_SALT en .env}
      - JWT_SECRET=${JWT_SECRET:?falta JWT_SECRET en .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?falta ENCRYPTION_KEY en .env}
      - VERIFICACION_MAX_DIAS=${VERIFICACION_MAX_DIAS:-180}
      - REBUILD_WEBHOOK_URL=${REBUILD_WEBHOOK_URL:-}
      - REBUILD_WEBHOOK_SECRET=${REBUILD_WEBHOOK_SECRET:-}
      - SEED_READONLY_API_TOKEN=${SEED_READONLY_API_TOKEN:-}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
    environment:
      - HOST=0.0.0.0

  cms-prod:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      target: prod
    profiles: ["prod"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "1337:1337"
    volumes:
      - cms_uploads:/app/apps/cms/public/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-yanapaway_cms}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-strapi}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?falta DATABASE_PASSWORD en .env}
      - DATABASE_SSL=${DATABASE_SSL:-false}
      - APP_KEYS=${APP_KEYS:?falta APP_KEYS en .env}
      - API_TOKEN_SALT=${API_TOKEN_SALT:?falta API_TOKEN_SALT en .env}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:?falta ADMIN_JWT_SECRET en .env}
      - TRANSFER_TOKEN_SALT=${TRANSFER_TOKEN_SALT:?falta TRANSFER_TOKEN_SALT en .env}
      - JWT_SECRET=${JWT_SECRET:?falta JWT_SECRET en .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?falta ENCRYPTION_KEY en .env}
      - VERIFICACION_MAX_DIAS=${VERIFICACION_MAX_DIAS:-180}
      - REBUILD_WEBHOOK_URL=${REBUILD_WEBHOOK_URL:-}
      - REBUILD_WEBHOOK_SECRET=${REBUILD_WEBHOOK_SECRET:-}

  web-prod:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    profiles: ["prod"]
    ports:
      - "8080:80"

volumes:
  pgdata:
  cms_uploads:
